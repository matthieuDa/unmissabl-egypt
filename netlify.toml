[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
  ASTRO_TELEMETRY_DISABLED = "1"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[[redirects]]
  from = "/fr/destinations/iceland/"
  to = "/fr/destinations/"
  status = 301
[[redirects]]
  from = "/en/destinations/iceland/"
  to = "/en/destinations/"
  status = 301
